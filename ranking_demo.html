<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking de Perdas · Análise Comercial</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap');
:root{
  --bg:#f0f4f8;
  --surface:#ffffff;
  --surface2:#f8fafc;
  --border:#dde3ed;
  --border2:#c8d2e0;
  --text:#1e293b;
  --muted:#7a8fa8;
  --accent:#d97706;
  --red:#dc2626;
  --cyan:#0284c7;
  --green:#15803d;
  --purple:#6d28d9;
  --orange:#c2410c;
  --bar-bg:#e8eef6;
  --shadow:0 1px 4px rgba(30,41,59,.08),0 0 0 1px var(--border);
  --shadow-md:0 4px 16px rgba(30,41,59,.1),0 0 0 1px var(--border);
  --hH:56px;--pH:42px;--nH:48px;--r:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;font-size:13px;min-height:100vh;overflow-x:hidden}

/* ── HEADER ── */
header{height:var(--hH);background:var(--surface);border-bottom:1px solid var(--border);
  box-shadow:0 1px 3px rgba(30,41,59,.06);
  display:flex;align-items:center;padding:0 28px;gap:14px;
  position:sticky;top:0;z-index:300}
.logo-dot{width:10px;height:10px;background:var(--accent);border-radius:50%;box-shadow:0 0 0 3px rgba(217,119,6,.18);flex-shrink:0}
header h1{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;letter-spacing:.03em;color:var(--text)}
header .sub{font-size:11px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-left:auto}

/* ── PERIOD BAR ── */
.period-bar{height:var(--pH);background:var(--surface2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 28px;gap:6px;
  position:sticky;top:var(--hH);z-index:290;overflow-x:auto}
.period-bar::-webkit-scrollbar{height:0}
.plbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:4px;white-space:nowrap}
.pb{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);
  color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.05em;
  padding:5px 14px;cursor:pointer;transition:all .2s;white-space:nowrap}
.pb:hover{border-color:var(--accent);color:var(--accent)}
.pb.ac{background:rgba(2,132,199,.08);border-color:var(--cyan);color:var(--cyan);font-weight:500}
.pb.ap{background:rgba(109,40,217,.07);border-color:var(--purple);color:var(--purple);font-weight:500}
.pb.ax{background:rgba(217,119,6,.1);border-color:var(--accent);color:var(--accent);font-weight:500}
.pdiv{width:1px;height:20px;background:var(--border);margin:0 6px}
.mbadge{margin-left:auto;font-size:10px;padding:3px 10px;border-radius:20px;letter-spacing:.06em;white-space:nowrap;font-weight:500}
.bc{background:rgba(2,132,199,.1);color:var(--cyan);border:1px solid rgba(2,132,199,.25)}
.bp{background:rgba(109,40,217,.08);color:var(--purple);border:1px solid rgba(109,40,217,.2)}
.bx{background:rgba(217,119,6,.1);color:var(--accent);border:1px solid rgba(217,119,6,.25)}

/* ── NAV ── */
nav{height:var(--nH);background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:flex-end;padding:0 28px;gap:2px;
  position:sticky;top:calc(var(--hH) + var(--pH));z-index:280;overflow-x:auto}
nav::-webkit-scrollbar{height:0}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);
  font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:10px 16px;cursor:pointer;transition:color .2s,border-color .2s;
  white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab .tn{font-size:9px;background:var(--bg);border:1px solid var(--border);border-radius:4px;
  padding:1px 5px;color:var(--muted);transition:.2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab.active .tn{background:rgba(217,119,6,.1);border-color:rgba(217,119,6,.25);color:var(--accent)}

/* ── PAGES ── */
.page{display:none;padding:28px;animation:fadeIn .2s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--text);margin-bottom:3px}
.page-desc{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:20px}

/* ── SUMMARY ROW: título à esquerda + KPIs à direita em linha única ── */
.summary-row{display:flex;align-items:stretch;gap:0;margin-bottom:20px;
  background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.summary-title-block{
  display:flex;flex-direction:column;justify-content:center;
  padding:12px 20px;border-right:2px solid var(--border2);
  min-width:170px;flex-shrink:0;background:var(--surface2)}
.st-label{font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.st-name{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--text);line-height:1.2}
.summary-chips{display:flex;flex-wrap:nowrap;gap:0;flex:1;overflow-x:auto}
.summary-chips::-webkit-scrollbar{height:3px}
.summary-chips::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── CHIP ── */
.chip{padding:9px 14px;display:flex;flex-direction:column;gap:2px;
  border-right:1px solid var(--border);min-width:100px;white-space:nowrap;flex-shrink:0}
.chip:last-child{border-right:none}
.chip-lbl{font-size:9px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.chip-val{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text)}
.cv-r{color:var(--red)}.cv-a{color:var(--accent)}.cv-c{color:var(--cyan)}
.cv-g{color:var(--green)}.cv-p{color:var(--purple)}


/* ── COMP CHIPS ── */
.chips-comp{display:flex;flex-wrap:wrap;gap:0;flex:0 0 auto}
.chip-comp{padding:14px 18px;display:flex;flex-direction:column;gap:5px;
  border-right:1px solid var(--border);min-width:140px}
.chip-comp:last-child{border-right:none}
.cc-title{font-size:10px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.cc-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cc-yr{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:500}
.yr-p{background:rgba(109,40,217,.08);color:var(--purple)}
.yr-c{background:rgba(2,132,199,.08);color:var(--cyan)}
.cc-val{font-family:'Syne',sans-serif;font-size:13px;font-weight:700}
.delta-c{display:inline-flex;align-items:center;gap:4px;font-size:10px;
  padding:2px 7px;border-radius:20px;margin-top:2px;font-weight:500}
.dg{background:rgba(21,128,61,.1);color:var(--green)}
.db{background:rgba(220,38,38,.1);color:var(--red)}
.dn{background:var(--bg);color:var(--muted)}

/* ── CONTROLS ── */
.controls{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:10px 16px;display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap;
  box-shadow:0 1px 3px rgba(30,41,59,.04)}
.csep{width:1px;height:20px;background:var(--border);margin:0 4px;align-self:center}
.clbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
select,input[type=text]{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;
  color:var(--text);font-family:'DM Mono',monospace;font-size:11px;padding:5px 9px;
  cursor:pointer;outline:none;transition:border-color .2s,box-shadow .2s}
select:hover,select:focus,input[type=text]:hover,input[type=text]:focus{
  border-color:var(--accent);box-shadow:0 0 0 2px rgba(217,119,6,.12)}
select option{background:var(--surface)}
select.fil{border-color:var(--accent);background:rgba(217,119,6,.05);color:var(--accent)}

/* ── PILLS ── */
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;min-height:4px}
.pill{display:inline-flex;align-items:center;gap:5px;
  background:rgba(217,119,6,.08);border:1px solid rgba(217,119,6,.2);
  border-radius:20px;padding:3px 10px;font-size:10px;color:var(--accent);font-weight:500}
.pill b{color:var(--text);font-weight:500}
.pill-x{cursor:pointer;opacity:.5;margin-left:2px;font-size:9px}
.pill-x:hover{opacity:1}

/* ── RANK TABLE ── */
.rank-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--shadow)}
.tbl-scroll{overflow-x:auto}
.tbl-scroll::-webkit-scrollbar{height:4px}
.tbl-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.rank-head{display:grid;border-bottom:1px solid var(--border);
  padding:10px 18px;font-size:10px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);background:var(--surface2);min-width:max-content}
.rank-row{display:grid;padding:0 18px;border-bottom:1px solid var(--border);
  align-items:center;min-height:50px;transition:background .15s;min-width:max-content}
.rank-row:last-child{border-bottom:none}
.rank-row:hover{background:#f8fafd}
.rank-scroll{max-height:520px;overflow-y:auto;overflow-x:hidden}
.rank-scroll::-webkit-scrollbar{width:5px}
.rank-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.pos{font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:var(--muted)}
.pos.t1{color:var(--red)}.pos.t2{color:var(--orange)}.pos.t3{color:var(--accent)}
.nc{display:flex;flex-direction:column;gap:1px;overflow:hidden}
.nm{color:var(--text);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ns{font-size:10px;color:var(--muted)}
.num{font-size:11px;color:var(--text);text-align:right}
.num.r{color:var(--red)}.num.a{color:var(--accent)}.num.c{color:var(--cyan)}
.num.g{color:var(--green)}.num.p{color:var(--purple)}

/* ── BAR ── */
.bar-c{display:flex;align-items:center;gap:8px;min-width:150px}
.bar-t{flex:1;height:8px;background:var(--bar-bg);border-radius:4px;overflow:hidden}
.bar-f{height:100%;border-radius:4px;max-width:100%;animation:grow .6s ease-out both}
@keyframes grow{from{max-width:0}to{max-width:100%}}
.bar-p{font-size:11px;min-width:46px;text-align:right;font-weight:500}

/* ── DELTA ── */
.delta{font-size:10px;text-align:center;padding:2px 6px;border-radius:20px;white-space:nowrap;font-weight:500}
.delta.g{background:rgba(21,128,61,.1);color:var(--green)}
.delta.b{background:rgba(220,38,38,.1);color:var(--red)}
.delta.n{background:var(--bg);color:var(--muted)}

.empty{padding:36px;color:var(--muted);text-align:center;font-size:12px}


/* ── DESTNS KPI STRIP ── */
.destns-strip{display:flex;gap:0;border-top:1px solid var(--border);flex-wrap:wrap}
.destns-chip{padding:8px 14px;display:flex;flex-direction:column;gap:2px;
  border-right:1px solid var(--border);flex-shrink:0}
.destns-chip:last-child{border-right:none}
.destns-name{font-size:9px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:1px}
.destns-vals{display:flex;gap:10px;align-items:baseline}
.destns-v{font-family:'Syne',sans-serif;font-size:12px;font-weight:700}
.destns-pct{font-size:10px;font-weight:600}

@media(max-width:700px){
  .page{padding:14px}
  nav,header,.period-bar{padding:0 14px}
  .chip,.chip-comp{min-width:90px}
}
</style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <h1>ANÁLISE DE PERDAS</h1>
  <span class="sub">Ranking Operacional · Demo</span>
</header>

<div class="period-bar">
  <span class="plbl">Período</span>
  <button class="pb" id="pb-prev" onclick="setPeriod('prev')">Mai/2024</button>
  <button class="pb ac" id="pb-cur" onclick="setPeriod('cur')">Mai/2025</button>
  <div class="pdiv"></div>
  <button class="pb" id="pb-comp" onclick="setPeriod('comp')">⇄ Comparativo</button>
  <span class="mbadge bc" id="mbadge">Mai/2025</span>
</div>

<nav>
  <button class="tab active" onclick="goTo(0)"><span class="tn">01</span> Por Filial</button>
  <button class="tab"        onclick="goTo(1)"><span class="tn">02</span> Por Família</button>
  <button class="tab"        onclick="goTo(2)"><span class="tn">03</span> Por Agrupamento</button>
</nav>

<!-- PAGE 1 · FILIAL -->
<section class="page active" id="pg-0">
  <div class="summary-row" id="summary-filial"></div>
  <div class="controls">
    <span class="clbl">Ordenar</span>
    <select id="s0" onchange="renderFilial()">
      <option value="pct_asc">% Perda ↑</option><option value="pct_desc">% Perda ↓</option>
      <option value="perda_desc">R$ Perda ↓</option><option value="vlr_desc">R$ Vendas ↓</option>
    </select>
    <div class="csep"></div>
    <span class="clbl">Família</span>
    <select id="f0-fa" onchange="renderFilial();syncAgr0()"><option value="">Todas</option></select>
    <span class="clbl">Agrupamento</span>
    <select id="f0-a" onchange="renderFilial();syncFam0()"><option value="">Todos</option></select>
  </div>
  <div class="pills" id="pills-0"></div>
  <div class="rank-wrap"><div class="tbl-scroll">
    <div class="rank-head" id="h0"></div>
    <div class="rank-scroll" id="b-filial"></div>
  </div></div>
</section>

<!-- PAGE 2 · FAMÍLIA -->
<section class="page" id="pg-1">
  <div class="summary-row" id="summary-fam"></div>
  <div class="controls">
    <span class="clbl">Ordenar</span>
    <select id="s1" onchange="renderFamilia()">
      <option value="pct_asc">% Perda ↑</option><option value="pct_desc">% Perda ↓</option>
      <option value="perda_desc">R$ Perda ↓</option><option value="vlr_desc">R$ Vendas ↓</option>
    </select>
    <div class="csep"></div>
    <span class="clbl">Filial</span>
    <select id="f1-f" onchange="renderFamilia()"><option value="">Todas</option></select>
    <span class="clbl">Família</span>
    <select id="f1-fa" onchange="renderFamilia();syncAgr1()"><option value="">Todas</option></select>
    <span class="clbl">Agrupamento</span>
    <select id="f1-a" onchange="renderFamilia();syncFam1()"><option value="">Todos</option></select>
  </div>
  <div class="pills" id="pills-1"></div>
  <div class="rank-wrap"><div class="tbl-scroll">
    <div class="rank-head" id="h1"></div>
    <div class="rank-scroll" id="b-fam"></div>
  </div></div>
</section>

<!-- PAGE 3 · AGRUPAMENTO -->
<section class="page" id="pg-2">
  <div class="summary-row" id="summary-agr"></div>
  <div class="controls">
    <span class="clbl">Ordenar</span>
    <select id="s2" onchange="renderAgrupamento()">
      <option value="pct_asc">% Perda ↑</option><option value="pct_desc">% Perda ↓</option>
      <option value="perda_desc">R$ Perda ↓</option><option value="vlr_desc">R$ Vendas ↓</option>
    </select>
    <div class="csep"></div>
    <span class="clbl">Filial</span>
    <select id="f2-f" onchange="renderAgrupamento()"><option value="">Todas</option></select>
    <span class="clbl">Família</span>
    <select id="f2-fa" onchange="renderAgrupamento();syncAgr2()"><option value="">Todas</option></select>
    <span class="clbl">Agrupamento</span>
    <select id="f2-a" onchange="renderAgrupamento();syncFam2()"><option value="">Todos</option></select>
  </div>
  <div class="pills" id="pills-2"></div>
  <div class="rank-wrap"><div class="tbl-scroll">
    <div class="rank-head" id="h2"></div>
    <div class="rank-scroll" id="b-agr"></div>
  </div></div>
</section>

function srt(a,m){

}
function fil(raw,{destns='',filial='',agrupamento='',familia=''}={}){
  return raw.filter(r=>
    (!destns||r.destns===destns)&&(!filial||String(r.pk_filial)===String(filial))&&
    (!agrupamento||r.agrupamento===agrupamento)&&(!familia||r.familia===familia)
  );
}

// ═══════════════════════════════════════════════════
//  AGGREGATE
// ═══════════════════════════════════════════════════
function agg(rows, kFn, nFn, xFn){
  const m={};
  // seenVlr : (aggKey § filial|família|agrupamento) — fat_agg está nesse nível.
  //           Cada produto tem 1 codagp → JOIN 1:1 → vlr correto por agrupamento.
  // seenPerda: (aggKey § filial|família|agrupamento|codtns)
  const seenVlr={}, seenPerda={};
  for(const r of rows){
    const k  = kFn(r);
    const vk = (r.pk_filial||'') + '|' + (r.pk_familia||'') + '|' + (r.agrupamento||'');
    const pk = vk + '|' + (r.codtns||'');
    if(!m[k]) m[k]={key:k,nome:nFn(r),perda:0,vlr:0,qtde_perda:0,qtde_venda:0,margem:0,impostos:0,...(xFn?.(r)||{})};
    const spk = k+'§'+pk;
    if(!seenPerda[spk]){
      m[k].perda      += r.perda      || 0;
      m[k].qtde_perda += r.qtde_perda || 0;
      seenPerda[spk]  = 1;
    }
    const svk = k+'§'+vk;
    if(!seenVlr[svk]){
      m[k].vlr        += r.vlr        || 0;
      m[k].qtde_venda += r.qtde_venda || 0;
      m[k].margem     += r.margem     || 0;
      m[k].impostos   += r.impostos   || 0;
      seenVlr[svk]    = 1;
    }
  }
  return Object.values(m).map(d=>({...d,
    pct:      d.vlr>0 ? (d.perda/d.vlr)*100                             : 0,
    perc_marg:(d.vlr+d.impostos)>0 ? (d.margem/(d.vlr+d.impostos))*100  : 0,
  }));
}
function mergeComp(cur,prev){
  const m={};
  cur.forEach(d=>m[d.key]={...d,cur:d,prev:null});
  prev.forEach(d=>{if(m[d.key])m[d.key].prev=d;else m[d.key]={...d,cur:null,prev:d};});
  return Object.values(m);
}

function chipsHtml(data, cls='c', pageName='', rows=[]){
  const tv=data.reduce((s,r)=>s+r.vlr,0),
        tp=data.reduce((s,r)=>s+r.perda,0),
        tm=data.reduce((s,r)=>s+(r.margem||0),0);
  const pct=tv>0?(tp/tv)*100:0, pm=tv>0?(tm/tv)*100:0;
  const titleBlock = pageName
    ? `<div class="summary-title-block"><div class="st-label">Ranking</div><div class="st-name">${pageName}</div></div>`
    : '';
  // Cards de transação inline à direita de "Vendas"
  const destnsChips = buildDestnsChips(rows, tv);
  return `${titleBlock}<div class="summary-chips">
    <div class="chip"><span class="chip-lbl">Perda R$</span><span class="chip-val cv-r">${fmt(tp)}</span></div>
    <div class="chip"><span class="chip-lbl">% Perda/Venda</span><span class="chip-val cv-r">${fmtP(pct)}</span></div>
    <div class="chip"><span class="chip-lbl">Margem R$</span><span class="chip-val cv-g">${fmt(tm)}</span></div>
    <div class="chip"><span class="chip-lbl">% Margem</span><span class="chip-val cv-g">${fmtP(pm)}</span></div>
    <div class="chip"><span class="chip-lbl">Vendas</span><span class="chip-val cv-${cls}">${fmt(tv)}</span></div>
    ${destnsChips}
  </div>`;
}

// Gera chips por codtns inline na barra de KPIs.
// Chave = codtns (único — nunca colapsa mesmo com destns iguais).
// Mostra TODOS os codtns com perda != 0:
//   · perda < 0 → saída/perda   (vermelho)
//   · perda > 0 → entrada/acerto (verde)
// Exclui apenas codtns com perda exatamente 0.
function buildDestnsChips(rows, totalVlr){
  if(!rows||!rows.length) return '';
  const cMap={};
  for(const r of rows){
    const code = String(r.codtns||'').trim();
    if(!code) continue;
    const p = Number(r.perda)||0;
    if(!cMap[code]) cMap[code]={ label: String(r.destns||code).trim()||code, perda:0 };
    cMap[code].perda += p;
  }
  const entries = Object.entries(cMap)
    .filter(([,v]) => Math.abs(v.perda) > 0.001)
    .sort((a,b) => Math.abs(b[1].perda)-Math.abs(a[1].perda));
  if(!entries.length) return '';
  return entries.map(([code,v])=>{
    const isEntrada = v.perda > 0;          // positivo = entrada = verde
    const isSaida   = v.perda < 0;          // negativo = saída/perda = vermelho
    const pct = totalVlr>0 ? (Math.abs(v.perda)/totalVlr)*100 : 0;
    const cls = isSaida ? 'cv-r' : 'cv-g';
    const prefix = isEntrada ? '↩ ' : '';
    return `<div class="chip" style="border-left:2px solid var(--border2)">
      <span class="chip-lbl">${v.label}</span>
      <span class="chip-val ${cls}">${prefix}${fmt(Math.abs(v.perda))}</span>
      <span class="chip-lbl ${cls}">${fmtP(pct)}</span>
    </div>`;
  }).join('');
}

      <div class="cc-row"><span class="cc-yr yr-p">${lPrev}</span><span class="cc-val cv-${pctCls(P.pct)}">${fmtP(P.pct)}</span></div>
      <div class="cc-row"><span class="cc-yr yr-c">${lCur}</span><span class="cc-val cv-${pctCls(C.pct)}">${fmtP(C.pct)}</span></div>
      <div class="delta-c ${dcls(dpct,true)}">${arr(dpct)} ${Math.abs(dpct).toFixed(2)} p.p.</div></div>
    <div class="chip-comp"><span class="cc-title">Margem R$</span>
      <div class="cc-row"><span class="cc-yr yr-p">${lPrev}</span><span class="cc-val cv-g">${fmt(P.tm)}</span></div>

    <div class="chip-comp"><span class="cc-title">% Margem</span>
      <div class="cc-row"><span class="cc-yr yr-p">${lPrev}</span><span class="cc-val">${fmtP(P.pm)}</span></div>
      <div class="cc-row"><span class="cc-yr yr-c">${lCur}</span><span class="cc-val">${fmtP(C.pm)}</span></div>
      <div class="delta-c ${dcls(dm)}">${arr(dm)} ${Math.abs(dm).toFixed(2)} p.p.</div></div>

      <div class="cc-row"><span class="cc-yr yr-p">${lPrev}</span><span class="cc-val cv-p">${fmt(P.tv)}</span></div>

// Chips de transação no modo comparativo — mostra Ant. vs Atu. por codtns
function buildDestnsChipsComp(rowsCur, rowsPrev, tvCur, tvPrev){
  // Agrega perda por codtns em cada período
  function aggByCode(rows){
    const m={};
    for(const r of rows){
      const code=String(r.codtns||'').trim(); if(!code) continue;
      const p=Number(r.perda)||0;
      if(!m[code]) m[code]={label:String(r.destns||code).trim()||code, perda:0};
      m[code].perda += p;
    }
    return m;
  }
  const mCur  = aggByCode(rowsCur);
  const mPrev = aggByCode(rowsPrev);
  // União dos codtns de ambos os períodos
  const codes = [...new Set([...Object.keys(mCur),...Object.keys(mPrev)])];
  // Filtra apenas codtns com valor absoluto > 0.001 em pelo menos um período
  const valid = codes.filter(c => Math.abs((mCur[c]||{perda:0}).perda) > 0.001 || Math.abs((mPrev[c]||{perda:0}).perda) > 0.001);
  if(!valid.length) return '';
  // Ordena por abs(perda atu) desc
  valid.sort((a,b) => Math.abs((mCur[b]||{perda:0}).perda) - Math.abs((mCur[a]||{perda:0}).perda));
    const lP=(typeof getLabel==='function')?getLabel('prev'):'Ant.';
  const lC=(typeof getLabel==='function')?getLabel('cur') :'Atu.';
  return valid.map(code=>{
    const vc = mCur[code]  || {label:code, perda:0};
    const vp = mPrev[code] || {label:code, perda:0};
    const label = vc.label || vp.label;
    const isSaida = vc.perda < 0 || vp.perda < 0;
    const cls = isSaida ? 'cv-r' : 'cv-g';
    const pctCur  = tvCur >0 ? (Math.abs(vc.perda)/tvCur )*100 : 0;
    const pctPrev = tvPrev>0 ? (Math.abs(vp.perda)/tvPrev)*100 : 0;
    const dpct    = pctCur - pctPrev;
    const dCls    = isSaida ? dcls(dpct, true) : dcls(dpct, false);
    return `<div class="chip-comp" style="border-left:2px solid var(--border2)">
      <span class="cc-title ${cls}">${label}</span>
      <div class="cc-row"><span class="cc-yr yr-p">Ant.</span>

const CN    ='40px 1fr 80px 110px 78px 90px 120px 110px 80px 160px';
// Comp — colunas mais largas e melhor espaçadas
const CC    ='40px 1fr 70px 100px 66px 70px 100px 66px  10px  70px 100px 66px 70px 100px 66px 66px';
// Agrupamento: extra coluna Família
const CN_AGR='40px 1fr 120px 80px 110px 78px 90px 120px 110px 80px 160px';
const CC_AGR='40px 1fr 110px 70px 100px 66px 70px 100px 66px  10px  70px 100px 66px 70px 100px 66px 66px';

// Cores do comparativo
// 25: laranja, exceto % Prd 25 = vermelho
// 26: verde, exceto % Prd 26 = vermelho (já definido em rowComp)
const O='color:#c2410c';   // laranja para dados 25
const G='color:#15803d';   // verde  para dados 26

// Cabeçalhos do comparativo (após # + nome + extraCols)

function hNorm(lbl,grid=CN,extraCols=''){return`style="grid-template-columns:${grid}">`+

  `<span style="text-align:right">Qtde Perda</span>`+
  `<span style="text-align:right">Perda R$</span>`+
  `<span style="text-align:right">% Perda</span>`+
  `<span style="text-align:right;${G}">Qtde Venda</span>`+
  `<span style="text-align:right;${G}">Venda R$</span>`+
  `<span style="text-align:right">Margem R$</span>`+

function rowNorm(d,i,mx,sub='',extraCells='',grid=CN){
  const w=barWidth(d.pct), bc=barColor(d.pct);
  const bar=`<div class="bar-c"><div class="bar-t"><div class="bar-f" style="width:${w}%;background:${bc};animation-delay:${i*.04}s"></div></div><span class="bar-p" style="color:${bc}">${fmtP(d.pct)}</span></div>`;
  return`<div class="rank-row" style="grid-template-columns:${grid}">
    <span class="pos ${posCls(i)}">${i+1}</span>
    <div class="nc"><span class="nm">${d.nome}</span>${sub?`<span class="ns">${sub}</span>`:''}</div>
    ${extraCells}
    <span class="num a">${fmtN(d.qtde_perda)}</span>
    <span class="num r">${fmt(d.perda)}</span>
    <span class="num r">${fmtP(d.pct)}</span>
    <span class="num g">${fmtN(d.qtde_venda)}</span>
    <span class="num g">${fmt(d.vlr)}</span>
    <span class="num g">${fmt(d.margem)}</span>
    <span class="num g">${fmtP(d.perc_marg)}</span>
    ${bar}</div>`;
}

function rowComp(m,i,sub='',extraCells='',grid=CC){
  const c=m.cur||{perda:0,pct:0,perc_marg:0,qtde_venda:0,qtde_perda:0,vlr:0};
  const p=m.prev||{perda:0,pct:0,perc_marg:0,qtde_venda:0,qtde_perda:0,vlr:0};
  const dp=c.pct-p.pct,cl=dcls(dp,true);
  return`<div class="rank-row" style="grid-template-columns:${grid}">
    <span class="pos ${posCls(i)}">${i+1}</span>
    <div class="nc"><span class="nm">${(m.cur||m.prev).nome}</span>${sub?`<span class="ns">${sub}</span>`:''}</div>
    ${extraCells}
    <span class="num" style="text-align:right;${O}">${p.qtde_perda?fmtN(p.qtde_perda):'—'}</span>
    <span class="num" style="text-align:right;${O}">${p.perda?fmt(p.perda):'—'}</span>
    <span class="num r">${p.pct?fmtP(p.pct):'—'}</span>
    <span class="num" style="text-align:right;${O}">${p.qtde_venda?fmtN(p.qtde_venda):'—'}</span>
    <span class="num" style="text-align:right;${O}">${p.vlr?fmt(p.vlr):'—'}</span>
    <span class="num" style="text-align:right;${O}">${p.perc_marg?fmtP(p.perc_marg):'—'}</span>
    <span></span>
    <span class="num r">${c.qtde_perda?fmtN(c.qtde_perda):'—'}</span>
    <span class="num r">${c.perda?fmt(c.perda):'—'}</span>
    <span class="num r">${c.pct?fmtP(c.pct):'—'}</span>
    <span class="num g">${c.qtde_venda?fmtN(c.qtde_venda):'—'}</span>
    <span class="num g">${c.vlr?fmt(c.vlr):'—'}</span>
    <span class="num g">${c.perc_marg?fmtP(c.perc_marg):'—'}</span>
    <span class="delta ${cl}" style="justify-self:center">${arr(dp)} ${Math.abs(dp).toFixed(2)}</span>
  </div>`;
}

function paintTable(hId,bId,label,data,grid=CN,gridC=CC,extraHead=''){
  const h=document.getElementById(hId);
  const b=document.getElementById(bId);
  if(MODE==='comp'){
    h.setAttribute('style','grid-template-columns:'+gridC);
    h.innerHTML='<span>#</span><span>'+label+'</span>'+extraHead+COMP_HEADS;
    b.innerHTML=data.length?data.map((m,i)=>rowComp(m,i,m.sub||'',m.extra||'',gridC)).join(''):'<div class="empty">Nenhum resultado.</div>';
  }else{
    h.setAttribute('style','grid-template-columns:'+grid);
    h.innerHTML='<span>#</span><span>'+label+'</span>'+extraHead+
      '<span style="text-align:right">Qtde Perda</span>'+
      '<span style="text-align:right">Perda R$</span>'+
      '<span style="text-align:right">% Perda</span>'+
      `<span style="text-align:right;${G}">Qtde Venda</span>`+
      `<span style="text-align:right;${G}">Venda R$</span>`+
      '<span style="text-align:right">Margem R$</span>'+
      '<span style="text-align:right">Margem %</span>'+
      '<span>% Perda / Barra</span>';
    b.innerHTML=data.length?data.map((d,i)=>rowNorm(d,i,0,d.sub||'',d.extra||'',grid)).join(''):'<div class="empty">Nenhum resultado.</div>';
  }
}

// Ordena array merged (comparativo) usando o mesmo critério do select
function compSort(arr, mode) {
  arr.sort((a,b) => {
    const cv = d => d?.pct||0, cv2 = d => d?.perda||0, cv3 = d => d?.vlr||0;
    if (mode==='pct_desc')   return cv(b.cur)-cv(a.cur);
    if (mode==='pct_asc')    return cv(a.cur)-cv(b.cur);
    if (mode==='perda_desc') return cv2(b.cur)-cv2(a.cur);
    if (mode==='vlr_desc')   return cv3(b.cur)-cv3(a.cur);
    return cv(b.cur)-cv(a.cur);
  });
}

function renderFilial(){
  const agr=gv('f0-a'),fam=gv('f0-fa'),sortMode=gv('s0');
  hl('f0-a','f0-fa');
  pills('pills-0',[
    {l:'Agrupamento',v:agr,i:'f0-a',fn:'renderFilial'},
    {l:'Família',v:fam,i:'f0-fa',fn:'renderFilial'},
  ]);
  if(MODE==='comp'){
    const rowsCur  = fil(RAW_CUR, {agrupamento:agr,familia:fam});
    const rowsPrev = fil(RAW_PREV,{agrupamento:agr,familia:fam});
    const c=srt(agg(rowsCur, r=>r.pk_filial,r=>r.nome_filial),sortMode);
    const p=srt(agg(rowsPrev,r=>r.pk_filial,r=>r.nome_filial),sortMode);
    paintSummary('summary-filial',chipsCompHtml(c,p,'Por Filial',rowsCur,rowsPrev));
    const mg=mergeComp(c,p);
    compSort(mg,sortMode);
    paintTable('h0','b-filial','Filial',mg);
  }else{
    const rows=fil(activeRaw(),{agrupamento:agr,familia:fam});
    const data=srt(agg(rows,r=>r.pk_filial,r=>r.nome_filial),sortMode);
    data.forEach(d=>d.sub='pk_filial: '+d.key);
    paintSummary('summary-filial',chipsHtml(data,MODE==='prev'?'p':'c','Por Filial',rows));
    paintTable('h0','b-filial','Filial',data);
  }
}

function renderFamilia(){
  const filial=gv('f1-f'),agr=gv('f1-a'),fam=gv('f1-fa');
  hl('f1-f','f1-a','f1-fa');
  pills('pills-1',[
    {l:'Filial',v:filial?gt('f1-f'):'',i:'f1-f',fn:'renderFamilia'},
    {l:'Família',v:fam,i:'f1-fa',fn:'renderFamilia'},
    {l:'Agrupamento',v:agr,i:'f1-a',fn:'renderFamilia'},
  ]);
  if(MODE==='comp'){
    const sortMode=gv('s1');
    const rowsCur  = fil(RAW_CUR, {filial,agrupamento:agr,familia:fam});
    const rowsPrev = fil(RAW_PREV,{filial,agrupamento:agr,familia:fam});
    let c=srt(agg(rowsCur, r=>r.pk_familia,r=>r.familia),sortMode);
    let p=srt(agg(rowsPrev,r=>r.pk_familia,r=>r.familia),sortMode);

  }else{
    const rows=fil(activeRaw(),{filial,agrupamento:agr,familia:fam});

    data.forEach(d=>d.sub='pk_familia: '+d.key);

function renderAgrupamento(){
  const filial=gv('f2-f'),agr=gv('f2-a'),fam=gv('f2-fa');
  hl('f2-f','f2-a','f2-fa');
  pills('pills-2',[
    {l:'Filial',v:filial?gt('f2-f'):'',i:'f2-f',fn:'renderAgrupamento'},
    {l:'Agrupamento',v:agr,i:'f2-a',fn:'renderAgrupamento'},
    {l:'Família',v:fam,i:'f2-fa',fn:'renderAgrupamento'},
  ]);
  // Chave: pk_familia§agrupamento — usa pk (numérico) para evitar colisão
  // quando o nome do agrupamento = nome da família (ex: "hortigranjeiros").
  const kFn=r=>(r.pk_familia||'')+'§'+(r.agrupamento||'sem agrupamento');
  const nFn=r=>r.agrupamento||'(sem agrupamento)';
  const xFn=r=>({familia:r.familia||'', pk_familia:r.pk_familia||''});
  const famCol=d=>`<div class="nc"><span class="nm">${d.familia||'—'}</span></div>`;
  const famColComp=m=>`<div class="nc"><span class="nm">${(m.cur||m.prev).familia||'—'}</span></div>`;
  const headFam='<span>Família</span>';
  if(MODE==='comp'){
    const sortMode=gv('s2');
    const rowsCur  = fil(RAW_CUR, {filial,agrupamento:agr,familia:fam});
    const rowsPrev = fil(RAW_PREV,{filial,agrupamento:agr,familia:fam});
    const c=agg(rowsCur, kFn,nFn,xFn);
    const p=agg(rowsPrev,kFn,nFn,xFn);
    paintSummary('summary-agr',chipsCompHtml(c,p,'Por Agrupamento',rowsCur,rowsPrev));
    const mg=mergeComp(c,p);
    compSort(mg,sortMode);
    mg.forEach(m=>m.extra=famColComp(m));
    paintTable('h2','b-agr','Agrupamento',mg,CN_AGR,CC_AGR,headFam);
  }else{
    const rows=fil(activeRaw(),{filial,agrupamento:agr,familia:fam});
    const data=srt(agg(rows,kFn,nFn,xFn),gv('s2'));
    data.forEach(d=>d.extra=famCol(d));
    paintSummary('summary-agr',chipsHtml(data,MODE==='prev'?'p':'c','Por Agrupamento',rows));
    paintTable('h2','b-agr','Agrupamento',data,CN_AGR,CC_AGR,headFam);
  }
}

// Labels lidos das constantes injetadas pelo generate.py (não do DOM)
function getLabel(mode){
  if(mode==='cur')  return LABEL_CUR;
  if(mode==='prev') return LABEL_PREV;
  return 'Comparativo ' + LABEL_PREV + ' × ' + LABEL_CUR;
}
function setPeriod(m){
  MODE=m;
  document.getElementById('pb-prev').className='pb'+(m==='prev'?' ap':'');
  document.getElementById('pb-cur').className='pb'+(m==='cur'?' ac':'');
  document.getElementById('pb-comp').className='pb'+(m==='comp'?' ax':'');
  const b=document.getElementById('mbadge');
  b.textContent=getLabel(m);
  b.className='mbadge '+(m==='cur'?'bc':m==='prev'?'bp':'bx');
  const lc=getLabel('cur'), lp=getLabel('prev');
  const descs={
    cur: 'menor % = melhor desempenho · '+lc,
    prev:'menor % = melhor desempenho · '+lp,
    comp:'Δ p.p. = diferença do % perda entre '+lp+' e '+lc+' — negativo (▼) = melhora'
  };
  [0,1,2].forEach(i=>{const e=document.getElementById('d'+i);if(e)e.textContent=descs[m]||descs.cur;});
  RENDERS[ACTIVE_TAB]();
}

// ═══════════════════════════════════════════════════
//  POPULATE SELECTS
// ═══════════════════════════════════════════════════
function addOpts(id,vals,txtFn){
  const el=document.getElementById(id);if(!el)return;
  vals.forEach(v=>{const o=document.createElement('option');
    o.value=Array.isArray(v)?v[0]:(typeof v==='object'?v.k:v);
    o.textContent=txtFn?txtFn(v):v;el.appendChild(o);});
}
function setOpts(id, vals, emptyLabel='Todos'){
  // Rebuilds select innerHTML completely — avoids duplicate options
  const el=document.getElementById(id);if(!el)return;
  el.innerHTML=`<option value="">${emptyLabel}</option>`+
    vals.map(v=>`<option value="${v}">${v}</option>`).join('');
}
function init(){
  const both=[...RAW_CUR,...RAW_PREV];
  const filiais=[...new Map(both.map(r=>[r.pk_filial,r.nome_filial])).entries()].sort((a,b)=>a[0]-b[0]);
  const agrs=[...new Set(both.map(r=>r.agrupamento).filter(Boolean))].sort();
  const fams=[...new Set(both.map(r=>r.familia).filter(Boolean))].sort();
  // filiais
  ['f1-f','f2-f'].forEach(id=>addOpts(id,filiais,([k,v])=>v.split('·')[1]?.trim()||v));
  // agrupamentos — full list
  ['f0-a','f1-a','f2-a'].forEach(id=>setOpts(id,agrs,'Todos'));
  // famílias — full list
  ['f0-fa','f1-fa','f2-fa'].forEach(id=>setOpts(id,fams,'Todas'));
}

const RENDERS=[renderFilial,renderFamilia,renderAgrupamento];
function goTo(i){
  ACTIVE_TAB=i;
  document.querySelectorAll('.page').forEach((p,j)=>p.classList.toggle('active',j===i));
  document.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('active',j===i));
  RENDERS[i]();
}
init();renderFilial();
